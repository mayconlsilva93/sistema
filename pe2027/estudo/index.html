<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DROM · Estudo de cachês 2027</title><meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="lk.css"><style>body{margin:0;background:#f4f4f2;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}#pin{-webkit-text-security:disc}#lkm{color:#6b6b6b;font-size:14px;min-height:20px}</style></head>
<body class="locked"><div id="lk" hidden><form id="lkf" autocomplete="off"><img class="lav" alt="" src="icon-round-192.png"><input id="usr" type="text" placeholder="login" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="xdu" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other"><input id="pin" placeholder="senha" type="text" maxlength="40" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="xdrom" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other"><button type="submit">Entrar</button><p id="lkm">Estudo de cachês 2027 · mesmo login do Hub</p></form></div>
<script>
/* DROM · Estudo de cachês 2027 — mesmo login do Hub/Painel; conteúdo criptografado com a chave do Painel */
(function(){
function FW(t){var d=new Date(t);for(var i=0;i<3;i++){var w=new Date(d.getFullYear(),d.getMonth()+i,1);w.setDate(1+(3-w.getDay()+7)%7);if(w.getTime()>t)return w.getTime()}return t}
var $=id=>document.getElementById(id),H=null,b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function db(){return new Promise((ok,er)=>{var r=indexedDB.open("drom",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)})}
async function kget(n){try{var d=await db();return await new Promise(ok=>{var q=d.transaction("k").objectStore("k").get(n);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})}catch(e){return null}}
async function kput(n,v){try{var d=await db();await new Promise(ok=>{var t=d.transaction("k","readwrite");t.objectStore("k").put(v,n);t.oncomplete=ok;t.onerror=ok})}catch(e){}}
async function kdel(n){try{var d=await db();await new Promise(ok=>{var t=d.transaction("k","readwrite");t.objectStore("k").delete(n);t.oncomplete=ok;t.onerror=ok})}catch(e){}}
async function derive(pin,salt){var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(salt),iterations:200000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])}
async function dec(key,iv,ct){return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(iv)},key,b64(ct)))}
async function open(cfg){$("lkm").textContent="Abrindo…";var K=await crypto.subtle.importKey("raw",b64(cfg.bk),"AES-GCM",false,["decrypt"]);
 var r=await (await fetch("e.json?v="+Date.now(),{cache:"no-store"})).json(),html=await dec(K,r.iv,r.ct);document.open();document.write(html);document.close()}
async function start(){try{H=await (await fetch("../../h.json",{cache:"no-store"})).json()}catch(e){$("lkm").textContent="Sem conexão. Tente de novo.";$("lk").hidden=false;return}
 var st=await kget("hub");if(st&&st.salt===H.salt&&Date.now()<FW(st.ts)){try{await open(JSON.parse(await dec(st.key,H.iv,H.ct)));return}catch(e){}}
 if(st)await kdel("hub");$("lk").hidden=false;$("usr").focus()}
$("lkf").onsubmit=async e=>{e.preventDefault();var us=$("usr").value.trim().toLowerCase(),pw=$("pin").value;if(!us||!pw)return;$("lkm").textContent="Verificando…";
 try{var key=await derive(us+"\n"+pw,H.salt),c=JSON.parse(await dec(key,H.iv,H.ct));await kput("hub",{key:key,salt:H.salt,ts:Date.now()});await open(c)}
 catch(er){$("lkm").textContent="Login ou senha incorretos.";$("pin").value="";$("pin").focus()}};
start()})();
</script></body></html>
