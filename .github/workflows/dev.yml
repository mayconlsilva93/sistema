name: DROM · DEV (planilha falsa → app dev e Booker (artista de teste))
on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 min (Booker também lê a planilha ao vivo ao abrir a proposta)
  workflow_dispatch:
permissions:
  contents: write
concurrency: dev
jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q cryptography openpyxl
      - run: python3 tools/dev/devsync.py
        env:
          DROM_BKK: ${{ secrets.DROM_BKK }}
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_KEY: ${{ secrets.DRIVE_KEY }}
      - run: |
          git config user.name "drom-bot"; git config user.email "drom-bot@users.noreply.github.com"
          git add dev/artistateste/d.json booker/dv.json tools/dev/hash.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm "dados dev (planilha falsa)" && (git push -q || (git pull -q --rebase && git push -q))
