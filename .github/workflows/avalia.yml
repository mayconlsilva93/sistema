name: DROM · Avaliação 2026 · projeção
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["DROM · Planilha → apps"]
    types: [completed]
  schedule:
    - cron: "5 3 * * *"   # 00:05 em Brasília (projeção muda com o dia)
permissions:
  contents: write
concurrency: {group: avalia, cancel-in-progress: false}
jobs:
  pj:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/avalia/pj.mjs
        env:
          DROM_BKK: ${{ secrets.DROM_BKK }}
          DROM_PIN: ${{ secrets.DROM_PIN }}
      - run: |
          git config user.name "drom-bot"; git config user.email "drom-bot@users.noreply.github.com"
          git add pe2027/avaliaform26/pj.json pe2027/avaliaform26/adm.json pe2027/avaliaform26/a.json pe2027/avaliaform26/data
          git diff --cached --quiet || (git commit -qm "avaliação: projeção" && (git push -q || (git pull -q --rebase && git push -q)))
